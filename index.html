<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>地域ボランティア募集 掲示板</title>
  
  <!-- Tailwind CSS & React / Babel / Lucide / LIFF CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
            }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .4; }
    }
    .animate-pulse { animation: pulse 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const MY_LIFF_ID = "2011743949-Sg6zYmMI";
    // ★ご自身のGASウェブアプリURL（末尾 /exec）
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzxxxx.../exec";

    // --- Lucide アイコン ラッパーコンポーネント ---
    const Icon = ({ name, size = 18, className = "" }) => {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [name]);
      return <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block shrink-0 stroke-[1.75] ${className}`}></i>;
    };

    // --- メインアプリケーション ---
    function App() {
      const [quests, setQuests] = useState([]);
      const [loading, setLoading] = useState(false);
      const [authVolunteer, setAuthVolunteer] = useState(null);
      const [lineUser, setLineUser] = useState({ id: "", name: "" });
      
      // 画面状態
      const [currentView, setCurrentView] = useState("list"); // "list" | "detail"
      const [selectedQuest, setSelectedQuest] = useState(null);

      // モーダル・シート状態
      const [showRegisterModal, setShowRegisterModal] = useState(false);
      const [showApplyModal, setShowApplyModal] = useState(false);
      const [showApplicantsSheet, setShowApplicantsSheet] = useState(false);
      const [sheetQuest, setSheetQuest] = useState(null);
      const [showReportModal, setShowReportModal] = useState(false);
      const [reportQuestId, setReportQuestId] = useState("");

      // フォーム状態
      const [loginNo, setLoginNo] = useState("");
      const [loginPhone4, setLoginPhone4] = useState("");
      const [regName, setRegName] = useState("");
      const [regPhone, setRegPhone] = useState("");
      const [isSubmitting, setIsSubmitting] = useState(false);

      // トースト通知状態
      const [toast, setToast] = useState({ show: false, message: "", type: "info" });

      const showToast = (message, type = "info") => {
        setToast({ show: true, message, type });
        setTimeout(() => {
          setToast({ show: false, message: "", type: "info" });
        }, 4000);
      };

      // API通信ラッパー
      const callApi = async (payload) => {
        const parts = [];
        for (const key in payload) {
          if (Object.prototype.hasOwnProperty.call(payload, key)) {
            const val = payload[key];
            if (val !== undefined && val !== null) {
              parts.push(encodeURIComponent(key) + "=" + encodeURIComponent(String(val)));
            }
          }
        }
        const url = GAS_API_URL + (GAS_API_URL.includes("?") ? "&" : "?") + parts.join("&");
        const res = await fetch(url, { method: "GET" });
        if (!res.ok) throw new Error(`通信エラー (${res.status})`);
        const result = await res.json();
        if (!result.success) throw new Error(result.error || "処理に失敗しました。");
        return result.data;
      };

      // 募集一覧取得
      const fetchQuests = async () => {
        setLoading(true);
        try {
          const data = await callApi({ action: "getOpenQuests" });
          setQuests(data || []);
        } catch (err) {
          showToast(err.message, "error");
        } finally {
          setLoading(false);
        }
      };

      // ログイン処理
      const handleLogin = async (no, phone4, isSilent = false) => {
        if (!no || !phone4) {
          if (!isSilent) showToast("登録番号と電話番号下4桁を入力してください。", "error");
          return;
        }
        setIsSubmitting(true);
        try {
          const res = await callApi({
            action: "login",
            volunteerNo: no,
            phoneLast4: phone4,
            lineUserId: lineUser.id || ""
          });
          setAuthVolunteer(res);
          localStorage.setItem("saved_vol_no", res.volunteerNo);
          localStorage.setItem("saved_vol_phone4", res.phoneLast4);
          if (!isSilent) showToast(`${res.name} 様として認証しました。`, "success");
          fetchQuests();
        } catch (err) {
          if (!isSilent) showToast(err.message, "error");
          if (isSilent) {
            localStorage.removeItem("saved_vol_no");
            localStorage.removeItem("saved_vol_phone4");
          }
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleLogout = () => {
        localStorage.removeItem("saved_vol_no");
        localStorage.removeItem("saved_vol_phone4");
        setAuthVolunteer(null);
        setQuests([]);
        setCurrentView("list");
        showToast("認証を解除しました。", "info");
      };

      // 新規登録処理
      const handleRegister = async () => {
        if (!regName.trim() || !regPhone.trim()) {
          showToast("お名前とお電話番号を入力してください。", "error");
          return;
        }
        setIsSubmitting(true);
        try {
          const res = await callApi({
            action: "register",
            lineUserId: lineUser.id || "未取得",
            lineDisplayName: lineUser.name || regName.trim(),
            name: regName.trim(),
            phone: regPhone.trim()
          });
          setShowRegisterModal(false);
          setLoginNo(res.volunteerNo);
          setLoginPhone4(res.phoneLast4);
          showToast(`登録完了：登録番号は【${res.volunteerNo}】です。`, "success");
          handleLogin(res.volunteerNo, res.phoneLast4, true);
        } catch (err) {
          showToast(err.message, "error");
        } finally {
          setIsSubmitting(false);
        }
      };

      // 立候補処理
      const handleApply = async () => {
        if (!selectedQuest || !authVolunteer) return;
        setIsSubmitting(true);
        try {
          await callApi({
            action: "apply",
            reqId: selectedQuest.id,
            volunteerNo: authVolunteer.volunteerNo,
            applicantName: `[${authVolunteer.volunteerNo}] ${authVolunteer.name}`,
            applicantContact: authVolunteer.phone || ""
          });
          setShowApplyModal(false);
          showToast("立候補を受け付けました。LINEトークをご確認ください。", "success");
          fetchQuests();
          setCurrentView("list");
        } catch (err) {
          showToast(err.message, "error");
        } finally {
          setIsSubmitting(false);
        }
      };

      // 完了報告アンケート送信
      const handleReportSubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        setIsSubmitting(true);
        try {
          await callApi({
            action: "submitReport",
            reqId: reportQuestId,
            volunteerNo: authVolunteer.volunteerNo,
            status: fd.get("status"),
            mood: fd.get("mood"),
            notes: fd.get("notes") || ""
          });
          setShowReportModal(false);
          showToast("完了報告を送信しました。ありがとうございました。", "success");
          if (window.liff && window.liff.isInClient()) {
            window.liff.closeWindow();
          } else {
            fetchQuests();
          }
        } catch (err) {
          showToast(err.message, "error");
        } finally {
          setIsSubmitting(false);
        }
      };

      // 初期化（LIFF & URLパラメータ判定）
      useEffect(() => {
        if (typeof liff !== "undefined" && MY_LIFF_ID) {
          liff.init({ liffId: MY_LIFF_ID }).then(() => {
            if (liff.isLoggedIn()) {
              liff.getProfile().then(p => {
                setLineUser({ id: p.userId, name: p.displayName });
              }).catch(() => {});
            }
          }).catch(console.error);
        }

        const params = new URLSearchParams(window.location.search);
        const report = params.get("report");
        const vol = params.get("vol");
        const p = params.get("p");

        if (vol && p) {
          setLoginNo(vol);
          setLoginPhone4(p);
          handleLogin(vol, p, true);
        } else {
          const sNo = localStorage.getItem("saved_vol_no");
          const sP4 = localStorage.getItem("saved_vol_phone4");
          if (sNo && sP4) {
            setLoginNo(sNo);
            setLoginPhone4(sP4);
            handleLogin(sNo, sP4, true);
          }
        }

        if (report) {
          const cleanDigits = report.replace(/[^0-9]/g, "");
          setReportQuestId(cleanDigits ? `V-${cleanDigits.padStart(3, "0")}` : report);
          setShowReportModal(true);
        }
      }, []);

      return (
        <div className="min-h-screen flex flex-col">
          {/* スティッキーヘッダー */}
          <header className="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-slate-200">
            <div className="max-w-2xl mx-auto px-4 h-14 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 rounded-lg bg-brand-600 text-white flex items-center justify-center font-bold">
                  <Icon name="hand-heart" size={18} className="text-white" />
                </div>
                <h1 className="font-bold text-slate-800 text-base tracking-tight">地域ボランティア募集</h1>
              </div>

              {authVolunteer && (
                <div className="flex items-center gap-2">
                  <button 
                    onClick={() => {
                      const num = prompt("報告する募集番号の数字を入力してください（例: 001）");
                      if (num) {
                        const clean = num.replace(/[^0-9]/g, "").padStart(3, "0");
                        setReportQuestId(`V-${clean}`);
                        setShowReportModal(true);
                      }
                    }}
                    className="text-xs px-2.5 py-1.5 font-medium rounded-md bg-slate-100 text-slate-700 hover:bg-slate-200 flex items-center gap-1 transition"
                  >
                    <Icon name="file-check" size={14} />
                    <span>完了報告</span>
                  </button>
                  <button 
                    onClick={handleLogout}
                    className="text-xs px-2 py-1.5 font-medium text-slate-500 hover:text-slate-800 transition"
                  >
                    再設定
                  </button>
                </div>
              )}
            </div>
          </header>

          {/* メインコンテナ */}
          <main className="flex-1 max-w-2xl w-full mx-auto p-4 space-y-4">
            
            {/* 認証ステータス / ログインカード */}
            {!authVolunteer ? (
              <div className="bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-3">
                <div className="flex items-center justify-between">
                  <h2 className="text-sm font-semibold text-slate-800 flex items-center gap-1.5">
                    <Icon name="shield-check" size={16} className="text-brand-600" />
                    <span>ボランティア認証</span>
                  </h2>
                  <span className="text-xs text-slate-500">登録済み番号でログイン</span>
                </div>

                <div className="grid grid-cols-5 gap-2">
                  <input
                    type="tel"
                    maxLength={4}
                    value={loginNo}
                    onChange={(e) => setLoginNo(e.target.value)}
                    placeholder="登録番号 (001)"
                    className="col-span-2 px-3 py-2 text-center text-sm font-bold border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500"
                  />
                  <input
                    type="tel"
                    maxLength={4}
                    value={loginPhone4}
                    onChange={(e) => setLoginPhone4(e.target.value)}
                    placeholder="電話番号下4桁"
                    className="col-span-3 px-3 py-2 text-center text-sm font-bold border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500"
                  />
                </div>

                <div className="flex gap-2 pt-1">
                  <button
                    disabled={isSubmitting}
                    onClick={() => handleLogin(loginNo, loginPhone4)}
                    className="flex-1 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm py-2.5 rounded-lg transition flex items-center justify-center gap-1.5 shadow-sm"
                  >
                    <Icon name="log-in" size={16} />
                    <span>{isSubmitting ? "認証中..." : "認証・一覧を表示"}</span>
                  </button>
                  <button
                    onClick={() => setShowRegisterModal(true)}
                    className="px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm py-2.5 rounded-lg transition"
                  >
                    新規登録
                  </button>
                </div>
              </div>
            ) : (
              <div className="bg-brand-50 border border-brand-100 rounded-xl p-3 flex items-center justify-between text-xs text-brand-700 font-medium">
                <div className="flex items-center gap-1.5">
                  <Icon name="user-check" size={15} className="text-brand-600" />
                  <span>認証中: <strong>[{authVolunteer.volunteerNo}] {authVolunteer.name} 様</strong></span>
                </div>
                <span className="bg-white border border-brand-200 text-brand-700 px-2 py-0.5 rounded-full text-[11px]">認証済み</span>
              </div>
            )}

            {/* パンくずリスト（詳細表示時のみ） */}
            {currentView === "detail" && (
              <nav className="flex items-center gap-1.5 text-xs text-slate-500 py-1">
                <button onClick={() => setCurrentView("list")} className="hover:text-slate-800 flex items-center gap-1">
                  <Icon name="arrow-left" size={14} />
                  <span>募集一覧</span>
                </button>
                <span>/</span>
                <span className="text-slate-800 font-medium truncate max-w-[200px]">{selectedQuest?.task}</span>
              </nav>
            )}

            {/* コンテンツ描画エリア */}
            {!authVolunteer ? (
              /* 未認証時プレースホルダー */
              <div className="bg-white border border-slate-200 rounded-xl p-8 text-center space-y-2">
                <div className="w-12 h-12 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto">
                  <Icon name="lock" size={22} />
                </div>
                <h3 className="font-bold text-slate-700 text-sm">認証が必要です</h3>
                <p className="text-xs text-slate-500 leading-relaxed">
                  プライバシー保護のため、ボランティア認証を行うと<br />現在募集中の案件詳細が表示されます。
                </p>
              </div>
            ) : loading ? (
              /* スケルトンスクリーン */
              <div className="space-y-3">
                {[1, 2, 3].map((n) => (
                  <div key={n} className="bg-white border border-slate-200 rounded-xl p-4 space-y-3 animate-pulse">
                    <div className="flex justify-between items-start">
                      <div className="h-5 bg-slate-200 rounded w-2/3"></div>
                      <div className="h-5 bg-slate-200 rounded w-16"></div>
                    </div>
                    <div className="space-y-1.5">
                      <div className="h-4 bg-slate-200 rounded w-1/2"></div>
                      <div className="h-4 bg-slate-200 rounded w-3/4"></div>
                    </div>
                    <div className="h-9 bg-slate-200 rounded w-full pt-2"></div>
                  </div>
                ))}
              </div>
            ) : currentView === "list" ? (
              /* 募集一覧ビュー */
              <div className="space-y-3">
                {quests.length === 0 ? (
                  <div className="bg-white border border-slate-200 rounded-xl p-8 text-center text-sm text-slate-500">
                    現在募集中の活動依頼はありません。
                  </div>
                ) : (
                  quests.map((q) => {
                    const remaining = q.capacity - q.current;
                    const isFull = remaining <= 0;
                    return (
                      <div key={q.id} className="bg-white border border-slate-200 rounded-xl p-4 shadow-sm hover:border-slate-300 transition space-y-3">
                        <div className="flex items-start justify-between gap-2">
                          <h3 
                            onClick={() => { setSelectedQuest(q); setCurrentView("detail"); }}
                            className="font-bold text-slate-900 text-base leading-snug hover:text-brand-600 cursor-pointer flex-1"
                          >
                            {q.task}
                          </h3>
                          
                          {/* ★定員タップで立候補者シート展開 & 重複表現の是正 */}
                          <button
                            onClick={() => { setSheetQuest(q); setShowApplicantsSheet(true); }}
                            className={`shrink-0 text-xs px-2.5 py-1 rounded-full font-semibold border flex items-center gap-1 transition ${
                              isFull 
                                ? "bg-slate-100 text-slate-600 border-slate-200" 
                                : "bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100"
                            }`}
                          >
                            <Icon name="users" size={13} />
                            <span>
                              {isFull ? "定員成立" : `残り ${remaining}名 / 定員 ${q.capacity}名`}
                            </span>
                          </button>
                        </div>

                        <div className="space-y-1.5 text-xs text-slate-600">
                          <div className="flex items-center gap-2">
                            <span className="flex items-center gap-1 font-semibold text-slate-500 w-12 shrink-0">
                              <Icon name="calendar" size={13} /> 日時
                            </span>
                            <span>{q.date} {q.time}〜</span>
                          </div>
                          
                          {/* ★場所 & Google Mapsリンク */}
                          <div className="flex items-center gap-2">
                            <span className="flex items-center gap-1 font-semibold text-slate-500 w-12 shrink-0">
                              <Icon name="map-pin" size={13} /> 場所
                            </span>
                            <span className="truncate flex-1">{q.location}</span>
                            <a
                              href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q.location)}`}
                              target="_blank"
                              rel="noopener noreferrer"
                              className="text-xs text-brand-700 hover:text-brand-800 font-medium underline flex items-center gap-0.5 shrink-0"
                            >
                              <span>地図</span>
                              <Icon name="external-link" size={11} />
                            </a>
                          </div>
                        </div>

                        <div className="pt-1 flex gap-2">
                          <button
                            onClick={() => { setSelectedQuest(q); setCurrentView("detail"); }}
                            className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs py-2 rounded-lg transition flex items-center justify-center gap-1"
                          >
                            <span>詳細を見る</span>
                            <Icon name="chevron-right" size={14} />
                          </button>

                          <button
                            disabled={isFull}
                            onClick={() => { setSelectedQuest(q); setShowApplyModal(true); }}
                            className={`flex-1 font-semibold text-xs py-2 rounded-lg transition flex items-center justify-center gap-1 ${
                              isFull 
                                ? "bg-slate-100 text-slate-400 cursor-not-allowed" 
                                : "bg-brand-600 hover:bg-brand-700 text-white shadow-sm"
                            }`}
                          >
                            <Icon name="check" size={14} />
                            <span>立候補する</span>
                          </button>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            ) : (
              /* ★詳細ページ（新設） */
              selectedQuest && (
                <div className="bg-white border border-slate-200 rounded-xl p-5 shadow-sm space-y-4">
                  <div className="flex items-start justify-between gap-2 border-b border-slate-100 pb-3">
                    <div>
                      <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">{selectedQuest.id}</span>
                      <h2 className="text-lg font-bold text-slate-900 mt-0.5">{selectedQuest.task}</h2>
                    </div>
                    <button
                      onClick={() => { setSheetQuest(selectedQuest); setShowApplicantsSheet(true); }}
                      className="text-xs px-2.5 py-1 rounded-full font-semibold border bg-emerald-50 text-emerald-700 border-emerald-200 shrink-0"
                    >
                      残り {selectedQuest.capacity - selectedQuest.current}名 / 定員 {selectedQuest.capacity}名
                    </button>
                  </div>

                  <div className="space-y-3 text-sm">
                    <div className="flex items-start gap-3">
                      <div className="w-16 font-semibold text-slate-500 flex items-center gap-1 shrink-0 pt-0.5">
                        <Icon name="calendar" size={15} /> 日時
                      </div>
                      <div className="text-slate-800 font-medium">
                        {selectedQuest.date} {selectedQuest.time}〜
                      </div>
                    </div>

                    <div className="flex items-start gap-3">
                      <div className="w-16 font-semibold text-slate-500 flex items-center gap-1 shrink-0 pt-0.5">
                        <Icon name="map-pin" size={15} /> 場所
                      </div>
                      <div className="flex-1 space-y-1">
                        <div className="text-slate-800 font-medium">{selectedQuest.location}</div>
                        <a
                          href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(selectedQuest.location)}`}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="inline-flex items-center gap-1 text-xs text-brand-700 hover:underline font-medium"
                        >
                          <Icon name="map" size={13} />
                          <span>Google Mapsで地図を確認する</span>
                          <Icon name="external-link" size={11} />
                        </a>
                      </div>
                    </div>

                    <div className="flex items-start gap-3">
                      <div className="w-16 font-semibold text-slate-500 flex items-center gap-1 shrink-0 pt-0.5">
                        <Icon name="info" size={15} /> 備考
                      </div>
                      <div className="text-slate-700 text-xs leading-relaxed whitespace-pre-wrap">
                        {selectedQuest.notes || "特記事項はありません。"}
                      </div>
                    </div>

                    {selectedQuest.briefingUrl && (
                      <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-lg flex items-center justify-between">
                        <div className="flex items-center gap-2 text-xs font-semibold text-emerald-800">
                          <Icon name="file-text" size={16} className="text-emerald-600" />
                          <span>事前ブリーフィング資料・現場写真</span>
                        </div>
                        <a 
                          href={selectedQuest.briefingUrl}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="text-xs bg-white border border-emerald-300 text-emerald-700 px-2.5 py-1 rounded font-medium hover:bg-emerald-100 flex items-center gap-1"
                        >
                          <span>閲覧</span>
                          <Icon name="external-link" size={11} />
                        </a>
                      </div>
                    )}
                  </div>

                  {/* 詳細ページ内の固定立候補アクション */}
                  <div className="pt-4 border-t border-slate-100 flex gap-2">
                    <button
                      onClick={() => setCurrentView("list")}
                      className="px-4 py-2.5 bg-slate-100 text-slate-700 font-semibold text-sm rounded-lg hover:bg-slate-200 transition"
                    >
                      戻る
                    </button>
                    <button
                      disabled={selectedQuest.capacity <= selectedQuest.current}
                      onClick={() => setShowApplyModal(true)}
                      className={`flex-1 font-semibold text-sm py-2.5 rounded-lg transition flex items-center justify-center gap-1.5 ${
                        selectedQuest.capacity <= selectedQuest.current
                          ? "bg-slate-100 text-slate-400 cursor-not-allowed"
                          : "bg-brand-600 hover:bg-brand-700 text-white shadow-sm"
                      }`}
                    >
                      <Icon name="check" size={16} />
                      <span>この活動に立候補する</span>
                    </button>
                  </div>
                </div>
              )
            )}
          </main>

          {/* ★ボトムシート：現在の立候補者リスト */}
          {showApplicantsSheet && sheetQuest && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-900/40 backdrop-blur-sm">
              <div className="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4 shadow-xl max-h-[80vh] flex flex-col">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <div className="flex items-center gap-2">
                    <Icon name="users" size={18} className="text-brand-600" />
                    <h3 className="font-bold text-slate-800 text-sm">現在の立候補者</h3>
                  </div>
                  <button onClick={() => setShowApplicantsSheet(false)} className="text-slate-400 hover:text-slate-600">
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto space-y-2">
                  <div className="text-xs text-slate-500 mb-2">
                    案件：<strong>{sheetQuest.task}</strong>（定員 {sheetQuest.capacity}名）
                  </div>

                  {sheetQuest.applicants && sheetQuest.applicants.length > 0 ? (
                    <ul className="divide-y divide-slate-100">
                      {sheetQuest.applicants.map((name, idx) => (
                        <li key={idx} className="py-2.5 flex items-center justify-between text-sm">
                          <span className="font-medium text-slate-800">{name}</span>
                          <span className="text-[11px] px-2 py-0.5 rounded bg-slate-100 text-slate-600">
                            {idx === 0 ? "リーダー候補" : "参加予定"}
                          </span>
                        </li>
                      ))}
                    </ul>
                  ) : (
                    <div className="text-center py-6 text-xs text-slate-400">
                      まだ立候補している方はいません。
                    </div>
                  )}
                </div>

                <button
                  onClick={() => setShowApplicantsSheet(false)}
                  className="w-full py-2.5 bg-slate-100 text-slate-700 font-semibold text-sm rounded-lg hover:bg-slate-200 transition"
                >
                  閉じる
                </button>
              </div>
            </div>
          )}

          {/* 新規登録モーダル */}
          {showRegisterModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
              <div className="bg-white w-full max-w-sm rounded-xl p-5 space-y-4 shadow-xl">
                <div className="flex items-center justify-between">
                  <h3 className="font-bold text-slate-900 text-base">ボランティア新規利用登録</h3>
                  <button onClick={() => setShowRegisterModal(false)} className="text-slate-400 hover:text-slate-600">
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <div className="space-y-3 text-sm">
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">お名前（本名）</label>
                    <input
                      type="text"
                      value={regName}
                      onChange={(e) => setRegName(e.target.value)}
                      placeholder="例：地域 太郎"
                      className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">お電話番号</label>
                    <input
                      type="tel"
                      value={regPhone}
                      onChange={(e) => setRegPhone(e.target.value)}
                      placeholder="例：09012345678"
                      className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none"
                    />
                  </div>
                </div>

                <div className="flex gap-2 pt-2">
                  <button
                    onClick={() => setShowRegisterModal(false)}
                    className="flex-1 py-2 bg-slate-100 text-slate-700 font-semibold text-xs rounded-lg hover:bg-slate-200 transition"
                  >
                    キャンセル
                  </button>
                  <button
                    disabled={isSubmitting}
                    onClick={handleRegister}
                    className="flex-1 py-2 bg-brand-600 text-white font-semibold text-xs rounded-lg hover:bg-brand-700 transition"
                  >
                    {isSubmitting ? "登録中..." : "登録して番号発行"}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 立候補確認モーダル */}
          {showApplyModal && selectedQuest && authVolunteer && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
              <div className="bg-white w-full max-w-sm rounded-xl p-5 space-y-4 shadow-xl">
                <h3 className="font-bold text-slate-900 text-base">立候補の確認</h3>
                
                <div className="bg-slate-50 p-3 rounded-lg text-xs space-y-1 border border-slate-100">
                  <div><strong>活動内容：</strong>{selectedQuest.task}</div>
                  <div><strong>活動日時：</strong>{selectedQuest.date} {selectedQuest.time}〜</div>
                  <div><strong>立候補者：</strong>[{authVolunteer.volunteerNo}] {authVolunteer.name} 様</div>
                </div>

                <p className="text-xs text-slate-500 leading-relaxed">
                  確定すると、LINEトーク画面へ当日の集合場所や依頼者の連絡先が自動送信されます。
                </p>

                <div className="flex gap-2 pt-2">
                  <button
                    onClick={() => setShowApplyModal(false)}
                    className="flex-1 py-2 bg-slate-100 text-slate-700 font-semibold text-xs rounded-lg hover:bg-slate-200 transition"
                  >
                    戻る
                  </button>
                  <button
                    disabled={isSubmitting}
                    onClick={handleApply}
                    className="flex-1 py-2 bg-brand-600 text-white font-semibold text-xs rounded-lg hover:bg-brand-700 transition"
                  >
                    {isSubmitting ? "送信中..." : "立候補を確定する"}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 活動完了報告モーダル */}
          {showReportModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
              <div className="bg-white w-full max-w-sm rounded-xl p-5 space-y-4 shadow-xl">
                <h3 className="font-bold text-slate-900 text-base">活動完了報告</h3>
                
                <form onSubmit={handleReportSubmit} className="space-y-3 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-600 mb-1">対象募集ID</label>
                    <input
                      type="text"
                      readOnly
                      value={reportQuestId}
                      className="w-full px-3 py-1.5 bg-slate-100 border border-slate-200 rounded font-bold"
                    />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-600 mb-1">Q1. 実施状況</label>
                    <select name="status" className="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs">
                      <option value="無事完了">無事に完了した</option>
                      <option value="一部課題あり">一部課題・やり残しあり</option>
                      <option value="未実施・中止">実施できなかった・中止</option>
                    </select>
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-600 mb-1">Q2. 現場の雰囲気</label>
                    <select name="mood" className="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs">
                      <option value="とても良かった">とても良かった（大変喜ばれた）</option>
                      <option value="普通">普通（問題なく活動できた）</option>
                      <option value="少し困ったことがあった">少し困ったことがあった</option>
                    </select>
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-600 mb-1">連絡事項・特記事項（任意）</label>
                    <textarea name="notes" rows={2} placeholder="気付いた点など" className="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-xs"></textarea>
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowReportModal(false)}
                      className="flex-1 py-2 bg-slate-100 text-slate-700 font-semibold text-xs rounded-lg"
                    >
                      閉じる
                    </button>
                    <button
                      type="submit"
                      disabled={isSubmitting}
                      className="flex-1 py-2 bg-brand-600 text-white font-semibold text-xs rounded-lg hover:bg-brand-700"
                    >
                      {isSubmitting ? "送信中..." : "報告を送信"}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* トースト通知 */}
          {toast.show && (
            <div className="fixed top-4 right-4 z-50 max-w-sm w-full bg-slate-900 text-white text-xs py-3 px-4 rounded-xl shadow-lg flex items-center justify-between gap-2 border border-slate-800 transition-all">
              <span>{toast.message}</span>
              <button onClick={() => setToast({ show: false, message: "", type: "info" })} className="text-slate-400 hover:text-white">
                <Icon name="x" size={14} />
              </button>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
